spring.application.name=HRMS
server.port=${PORT:8080}

# Default to embedded in-memory MySQL-compatible database for 100% zero-configuration instant cloud hosting on Render.
# When an external database URL is provided via environment variables (e.g., MySQL on Aiven, TiDB, Clever Cloud, or Localhost),
# Spring Boot will automatically connect to that external database instead!
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:hrms;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=true
