<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <title>Candidates — HRMS</title>

    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}"/>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Puritan:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: "Puritan", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
            background: #fff;
            color: #111;
        }
        .page-wrap { padding: 24px 150px; }

        .top-row {
            display:flex;
            justify-content:space-between;
            align-items:center;
            gap:16px;
            margin:14px 0 12px;
        }
        .page-title { margin:0; font-size:24px; font-weight:700; }

        .action-btn {
            background:#fff;
            border:2px solid #111;
            border-radius:8px;
            padding:.35rem .7rem;
            font-weight:600;
            text-decoration:none;
            color:#111;
        }
        .action-btn:hover { background:#111; color:#fff; }

        .text-input {
            padding:.45rem .6rem;
            border-radius:8px;
            border:1px solid #d6d6d6;
        }

        .table-container { overflow-x:auto; padding-top:12px; }

        .emp-table {
            width:100%;
            border-collapse:separate;
            border-spacing:0;
            table-layout:fixed;
        }

        .emp-table thead th {
            padding:12px 6px;
            font-weight:700;
            border-top:2px solid #000;
            border-bottom:2px solid #000;
        }
        .emp-table thead th:first-child {
            border-left:2px solid #000;
            border-top-left-radius:8px;
            border-bottom-left-radius:8px;
        }
        .emp-table thead th:last-child {
            border-right:2px solid #000;
            border-top-right-radius:8px;
            border-bottom-right-radius:8px;
        }

        .row-odd td { background:#fff; }
        .row-even td { background:#f5f5f5; }

        .emp-table tbody td {
            padding:13px 6px;
            white-space:nowrap;
            overflow:hidden;
            text-overflow:ellipsis;
        }

        .table-action-btn {
            border:2px solid #111;
            background:#fff;
            border-radius:8px;
            padding:.28rem .5rem;
            font-weight:600;
            text-decoration:none;
            color:#111;
        }
        .table-action-btn:hover { background:#111; color:#fff; }

        @media (max-width:1100px) { .page-wrap { padding:24px 40px; } }
        @media (max-width:768px) { .page-wrap { padding:24px; } }
    </style>
</head>

<body>

<div th:replace="fragments/header :: header"></div>

<div class="page-wrap">

    <div class="top-row">
        <div>
            <h3 class="page-title">Candidates</h3>

            <form th:action="@{/candidates}" method="get" style="margin-top:10px; display:flex; gap:8px;">
                <input type="text" name="keyword" class="text-input"
                       placeholder="Search candidate name"
                       th:value="${keyword}"/>
                <button class="action-btn" type="submit">Search</button>
            </form>
        </div>

        <div style="display:flex; gap:12px;">
            <a class="action-btn" th:href="@{/candidates/new}">Add Candidate</a>
            <a class="action-btn" th:href="@{/candidates/export/excel}">Export Excel</a>
            <a class="action-btn" th:href="@{/candidates/export/pdf}">Export PDF</a>
        </div>
    </div>

    <div class="table-container">
        <table class="emp-table">
            <thead>
            <tr>
                <th style="width:48px">ID</th>
                <th>Position</th>
                <th>Name</th>
                <th>Email</th>
                <th style="width:140px">Phone</th>
                <th style="width:110px">Status</th>
                <th style="width:170px">Applied At</th>
                <th style="width:140px">Actions</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="c,stat : ${candidates}"
                th:class="${stat.index % 2 == 0} ? 'row-odd' : 'row-even'">

                <td th:text="${c.id}"></td>

                <!-- ✅ CORRECT POSITION DISPLAY -->
                <td th:text="${c.requisition != null ? c.requisition.title : '-'}"></td>

                <td th:text="${c.name}"></td>
                <td th:text="${c.email}"></td>
                <td th:text="${c.phone}"></td>
                <td th:text="${c.status}"></td>
                <td th:text="${c.appliedAt}"></td>

                <td>
                    <a th:href="@{|/candidates/edit/${c.id}|}" class="table-action-btn">Edit</a>
                    <form th:action="@{|/candidates/delete/${c.id}|}" method="post"
                          style="display:inline"
                          onsubmit="return confirm('Delete this candidate?');">
                        <button class="table-action-btn" style="margin-left:8px">Delete</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

</div>

</body>
</html>
