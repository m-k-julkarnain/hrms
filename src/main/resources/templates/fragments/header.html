<!-- src/main/resources/templates/fragments/header.html -->
<div xmlns:th="http://www.thymeleaf.org" th:fragment="header">

    <!-- Puritan font (site-wide) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Puritan:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --nav-padding-x: 60px;
            --text: #111111;
        }

        .top-nav {
            width: 100%;
            padding: 16px var(--nav-padding-x);
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: black;
            border-bottom: 1px solid #eee;
            font-family: 'Puritan', system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            letter-spacing: 0.3px;
            box-sizing: border-box;
        }

        .top-nav-left {
            display:flex;
            align-items:center;
            gap: 26px;
        }

        .top-nav a {
            text-decoration: none;
            color: var(--text);
            font-size: 16px;
            font-weight: 600;
            color: white;
                        padding: 8px 5px;
        }

        .top-nav a.brand {
            font-size: 16px;
            font-weight: 600;
                        padding: 8px 5px;
        }

        .top-nav a:hover {
            border: 1px solid #fff;
            border-radius:8px;
            background: #fff;
            padding: 8px 5px;
            color: #000;
        }

        .top-nav-right {
            display: flex;
            align-items: center;
            gap: 18px;
            font-size: 16px;
            font-weight: 500;
        }

        .top-nav button {
            border: 1px solid var(--text);
            border-radius:8px;
            background: #fff;
            padding: 8px 14px;
            font-size: 16px;
            cursor: pointer;
            font-family: inherit;
            font-weight: 600;

        }

        .top-nav button:hover {
            border: 1px solid #fff;
            background: #000;
            color: #fff;
        }

        /* small screens: wrap items */
        @media (max-width: 900px) {
            .top-nav {
                padding-left: 18px;
                padding-right: 18px;
                flex-wrap: wrap;
                gap: 10px;
            }
            .top-nav-left { gap: 12px; }
            .top-nav a { font-size: 14px; }
        }
    </style>

    <nav class="top-nav" role="navigation" aria-label="Main navigation">
        <div class="top-nav-left">
            <a class="brand" th:href="@{/dashboard}">HRMS</a>
            <a th:href="@{/employees}">EMPLOYEES</a>
            <a th:href="@{/attendance}">ATTENDANCE</a>
            <a th:href="@{/candidates}">CANDIDATES</a>
            <a th:href="@{/requisitions}">REQUISITIONS</a>
            <a th:href="@{/payments}">PAYMENTS</a>
        </div>

        <div class="top-nav-right">

            <form th:action="@{/logout}" method="post" style="margin:0;">
                <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit">Logout</button>
            </form>
        </div>
    </nav>
</div>
