<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <title th:text="${requisition.id != null} ? 'Edit Requisition' : 'New Requisition'">Requisition</title>

    <!-- Bootstrap (local) -->
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}"/>

    <!-- Puritan font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Puritan:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        /* page + font reset (consistent with other pages) */
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: "Puritan", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #fff;
            color: #111;
            box-sizing: border-box;
        }
        *, *::before, *::after { box-sizing: inherit; }

        .page-wrap { padding: 120px 150px; box-sizing: border-box; }

        .page-title { margin:0 0 12px 0; font-size:24px; font-weight:700; letter-spacing:0.3px; }

        /* form card with border to match design */
        .form-card {
            background: #fff;
            padding: 22px;
            border-radius: 10px;
            border: 2px solid #000;              /* matches table header box style */
            box-shadow: 0 0 0 rgba(0,0,0,0);
        }

        .form-row { display:flex; gap:16px; align-items:flex-start; flex-wrap:wrap; margin-bottom:12px; }
        .form-col { flex:1 1 300px; min-width:180px; }

        label {
            display:block;
            font-weight:600;
            margin-bottom:6px;
        }

        /* inputs styled like other pages */
        .text-input, .textarea-input {
            width:100%;
            padding:.45rem .6rem;
            border-radius:8px;
            border:1px solid #d6d6d6;
            font-size:0.95rem;
            box-shadow:none;
            outline:none;
            background:#fff;
            box-sizing:border-box;
        }

        .textarea-input {
            min-height:96px;
            resize:vertical;
        }

        /* action button styles (consistent) */
        .action-btn {
            display:inline-block;
            background:#fff;
            color:#111;
            border:2px solid #111;
            border-radius:8px;
            padding:.375rem .7rem;
            font-weight:600;
            text-decoration:none;
            font-size:0.92rem;
            line-height:1;
            cursor:pointer;
        }
        .action-btn:hover { background:#111; color:#fff; text-decoration:none; }
        .action-btn-sm { padding:.25rem .5rem; font-size:0.88rem; border-radius:8px; }

        .muted { color:#666; margin-bottom:12px; display:block; }

        /* responsive tweaks */
        @media (max-width:1100px) {
            .page-wrap { padding-left:40px; padding-right:40px; }
        }
        @media (max-width:768px) {
            .page-wrap { padding-left:24px; padding-right:24px; }
            .form-row { flex-direction:column; gap:10px; align-items:stretch; }
        }
    </style>
</head>
<body>

<!-- header fragment -->
<div th:replace="fragments/header :: header"></div>

<div class="page-wrap">
    <h3 class="page-title" th:text="${requisition.id != null} ? 'Edit Requisition' : 'New Requisition'">New Requisition</h3>

    <div class="form-card">
        <form th:action="${requisition.id != null} ? @{/requisitions/update} : @{/requisitions}" method="post" style="display:block;">
            <input type="hidden" name="id" th:value="${requisition.id}" />

            <div class="form-row">
                <div class="form-col" style="flex: 1 1 420px;">
                    <label for="title">Title</label>
                    <input id="title" name="title" class="text-input" th:value="${requisition.title}" required />
                </div>
            </div>

            <div class="form-row">
                <div class="form-col" style="flex:1 1 100%;">
                    <label for="description">Description</label>
                    <textarea id="description" name="description" class="textarea-input" th:text="${requisition.description}"></textarea>
                </div>
            </div>

            <div style="margin-top:14px; display:flex; gap:12px; align-items:center;">
                <button type="submit" class="action-btn" th:text="${requisition.id != null} ? 'Update' : 'Save'">Save</button>
                <a class="action-btn" th:href="@{/requisitions}">Cancel</a>
            </div>
        </form>
    </div>
</div>

</body>
</html>
