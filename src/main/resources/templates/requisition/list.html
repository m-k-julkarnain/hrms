<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <title>Requisitions — HRMS</title>

    <!-- Bootstrap -->
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}"/>

    <!-- Puritan font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Puritan:wght@400;600;700&display=swap" rel="stylesheet">

    <style>

        /* Base design (same as attendance page) */
        html, body {
            margin: 0;
            padding: 0;
            font-family: "Puritan", system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
            background: #fff;
            color: #111;
        }

        .page-wrap { padding: 24px 150px; }

        .top-row {
            display:flex;
            justify-content:space-between;
            align-items:center;
            gap:16px;
            margin:14px 0 12px;
        }

        .page-title {
            font-size:24px;
            font-weight:700;
            margin:0;
        }

        /* Buttons */
        .action-btn {
            display:inline-block;
            background:#fff;
            color:#111;
            border:2px solid #111;
            border-radius:8px;
            padding:.375rem .7rem;
            font-weight:600;
            font-size:0.92rem;
            line-height:1;
            text-decoration:none;
            cursor:pointer;
        }
        .action-btn:hover { background:#111; color:#fff; }

        .action-btn-sm {
            padding:.28rem .5rem;
            font-size:0.88rem;
        }

        /* Search bar */
        .text-input {
            padding:.45rem .6rem;
            border-radius:8px;
            border:1px solid #d6d6d6;
            font-size:0.95rem;
            outline:none;
            background:#fff;
            width: 200px
        }

        /* TABLE */
        .table-container { overflow-x:auto; padding-top:12px; }

        .emp-table {
            width:100%;
            border-collapse:separate;
            border-spacing:0;
            table-layout:fixed;
            font-size:1.04rem;
        }

        /* header styled box */
        .emp-table thead th {
            padding:12px 6px;
            font-weight:700;
            border:none;
            background:#fff;
        }
        .emp-table thead th {
            border-top:2px solid #000;
            border-bottom:2px solid #000;
        }
        .emp-table thead th:first-child {
            border-left:2px solid #000;
            border-top-left-radius:8px;
            border-bottom-left-radius:8px;
        }
        .emp-table thead th:last-child {
            border-right:2px solid #000;
            border-top-right-radius:8px;
            border-bottom-right-radius:8px;
        }

        /* spacer row */
        .header-spacer td {
            height:12px;
            border:none;
        }
.header-spacer td {
    height: 6px !important;
    padding: 0 !important;
    line-height: 0 !important;
}

        /* alternating rows */
        .row-odd td { background:#fff; }
        .row-even td { background:#f5f5f5; }

        .emp-table tbody td {
            padding:13px 6px;
            white-space:nowrap;
            text-overflow:ellipsis;
            overflow:hidden;
            border:none;
        }

        .table-action-btn {
            display:inline-block;
            background:#fff;
            border:2px solid #111;
            color:#111;
            border-radius:8px;
            padding:.28rem .5rem;
            font-weight:600;
            font-size:0.88rem;
            text-decoration:none;
        }
        .table-action-btn:hover { background:#111; color:#fff; }

        /* Responsive */
        @media (max-width:1100px) {
            .page-wrap { padding: 24px 40px; }
        }
        @media (max-width:768px) {
            .page-wrap { padding: 24px; }
            .top-row { flex-direction:column; align-items:flex-start; gap:12px; }
            .emp-table thead { display:none; }
            .emp-table, .emp-table tbody,
            .emp-table tr, .emp-table td {
                display:block;
                width:100%;
            }
            .emp-table tr { margin-bottom:10px; }
            .emp-table td { white-space:normal; padding:10px; }
        }

    </style>
</head>
<body>

<div th:replace="fragments/header :: header"></div>

<div class="page-wrap">

    <div class="top-row">
        <div>
            <h3 class="page-title">Requisitions</h3>
        </div>

        <div style="display:flex; gap:12px;">
            <a class="action-btn" th:href="@{/requisitions/new}">Create Requisition</a>
            <a class="action-btn" th:href="@{/requisitions/export/excel}">Export Excel</a>
            <a class="action-btn" th:href="@{/requisitions/export/pdf}">Export PDF</a>
        </div>
    </div>

    <!-- SEARCH BAR -->
    <form method="get" th:action="@{/requisitions}" style="display:flex; gap:8px; align-items:center; margin-bottom:14px;">
        <input type="text"
               name="keyword"
               class="text-input"
               placeholder="Search by title or description"
               th:value="${keyword}">
        <button class="action-btn action-btn-sm">Search</button>
    </form>

    <!-- TABLE -->
    <div class="table-container">
        <table class="emp-table">
            <thead>
            <tr>
                <th style="width:48px;">ID</th>
                <th style="width:200px;">Title</th>
                <th>Description</th>
                <th style="width:130px;">Created By</th>
                <th style="width:180px;">Created At</th>
                <th style="width:140px;">Actions</th>
            </tr>
            </thead>

            <tbody>
            <tr class="header-spacer"><td colspan="6"></td></tr>

            <tr th:each="r,iter : ${requisitions}"
                th:class="${iter.index % 2 == 0} ? 'row-odd' : 'row-even'">

                <td th:text="${r.id}">1</td>
                <td th:text="${r.title}">Title</td>
                <td th:text="${r.description}">Description</td>
                <td th:text="${r.createdBy}">1</td>
                <td th:text="${r.createdAt}">2025-01-01</td>

                <td>
                    <a th:href="@{|/requisitions/edit/${r.id}|}" class="table-action-btn">Edit</a>

                    <form th:action="@{|/requisitions/delete/${r.id}|}" method="post"
                          th:onsubmit="return confirm('Delete this requisition?');"
                          style="display:inline;">
                        <button class="table-action-btn" type="submit" style="margin-left:8px;">Delete</button>
                    </form>
                </td>
            </tr>

            </tbody>
        </table>
    </div>

</div>

</body>
</html>
